[project]
name = "capstone-arxiv-copilot"
version = "0.1.0"
description = "arXiv Research Copilot — RAG Failure-Mode Battleground (capstone)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "openai>=1.50.0",
    "langsmith>=0.8.18",
    "langchain-core",
    "langchain-community",
    "langchain-openai",
    "langchain-text-splitters",
    "scikit-learn",
    "arxiv>=2.1.3",
    "python-dotenv>=1.2.2",
    "pandas",
    "pyarrow",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ranx>=0.3.21",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
